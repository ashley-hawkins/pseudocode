[workspace]
members = [
    "crates/pseudocode",
    "crates/pseudocode_cli",
    "crates/pseudocode_frontend",
    "crates/pseudocode_js",
]
package.license = "GPL-3.0-only"
resolver = "3"

[workspace.dependencies]
pseudocode = { path = "crates/pseudocode" }
pseudocode_frontend = { path = "crates/pseudocode_frontend" }
chumsky = { version = "0.12.0", features = ["pratt"] }
